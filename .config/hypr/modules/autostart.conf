# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox
exec-once = qs -c noctalia-shell
# exec-once = hyprpaper
exec-once = awww-daemon
exec-once = sleep 0.5 & swww img ~/Pictures/Wallpapers/47.jpg --transition-type grow --transition-duration 1 --transition-fps 60

# exec-once = dunst
exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data
exec-once = dbus-update-activation-environment --systemd GTK_IM_MODULE QT_IM_MODULE XMODIFIERS
exec-once = hyprctl setcursor capitaine-cursors 20
exec-once = /usr/libexec/polkit-mate-authentication-agent-1
